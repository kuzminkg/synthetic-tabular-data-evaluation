[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-replacement-experiments"
version = "1.3.0"
description = "Leakage-controlled experiments for synthetic tabular data replacement and augmentation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Debra Ritter"},
  {name = "Mario Kubek"},
  {name = "Kiril Kuzmin"},
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.9",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "statsmodels>=0.14",
]

[project.scripts]
synthrep = "synthrep.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
